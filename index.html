<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小金库</title>
<style>
:root {
  --primary: #5E6E8E;
  --primary2: #7B8BA8;
  --primary-light: #ECEFF4;
  --primary-dark: #4E5C78;
  --danger: #A8403F;
  --danger-light: #F4E9E9;
  --warning: #C28E2E;
  --warning-light: #F6EFE2;
  --success: #6F9460;
  --success-light: #EEF3E9;
  --text-primary: #2A2A2A;
  --text-secondary: #6A6A6A;
  --text-tertiary: #9A9A9A;
  --bg: #EFEDE8;
  --card-bg: #F7F5F2;
  --border: #DEDAD3;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  padding-bottom: env(safe-area-inset-bottom);
}

.container { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }

/* Header */
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
  color: white;
  padding: 14px 16px 16px;
  border-radius: 0 0 24px 24px;
  margin-bottom: 12px;
}
.header-row { display: flex; align-items: center; justify-content: space-between; }
.header-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.header-title svg { width: 28px; height: 28px; flex-shrink: 0; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.icon-btn:hover { background: rgba(255,255,255,0.3); }
.icon-btn svg { width: 18px; height: 18px; }
.header-subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }

/* Cards */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}

/* Section Title */
.section-title {
  font-size: 16px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 12px;
}
.section-title svg { width: 18px; height: 18px; }

/* Summary Cards */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.summary-card {
  border-radius: var(--radius-sm);
  padding: 18px 12px;
  text-align: center;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.summary-card.amount-card {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
  color: white;
}
.summary-card.interest-card {
  background: var(--card-bg);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.summary-value { font-size: 26px; font-weight: 800; line-height: 1.2; }
.summary-card.amount-card .summary-value { color: white; }
.summary-card.interest-card .summary-value { color: var(--text-primary); }
.summary-label { font-size: 13px; opacity: 0.9; margin-top: 6px; font-weight: 500; }

/* Tabs */
.tabs {
  display: flex;
  background: var(--card-bg);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab svg { width: 18px; height: 18px; }
.tab.active { background: var(--primary); color: white; }

/* Add Form */
.add-form { display: none; }
.add-form.show { display: block; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 140px; margin-bottom: 12px; }
.form-group.full { flex-basis: 100%; }
.form-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; display: block; }
.form-input, .form-select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  font-size: 16px;
  font-family: inherit;
  color: var(--text-primary);
  background: white;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus { border-color: var(--primary); }
.form-input::placeholder { color: var(--text-tertiary); }

/* Date Selects */
.date-selects { display: flex; gap: 6px; }
.date-sel { flex: 1; padding: 10px 8px; font-size: 16px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; color: var(--text-primary); background: white; outline: none; min-height: 44px; }
.date-sel:focus { border-color: var(--primary); }
.input-suffix { position: relative; }
.input-suffix .suffix {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: var(--text-tertiary); pointer-events: none;
}
.term-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.term-chip {
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 16px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-secondary);
  background: white;
  transition: all 0.2s;
  min-height: 32px;
  display: flex; align-items: center;
}
.term-chip:hover, .term-chip.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.form-actions { display: flex; gap: 10px; margin-top: 4px; }
.btn {
  padding: 11px 20px;
  border: none;
  border-radius: var(--radius-xs);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  min-height: 44px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary { background: var(--primary); color: white; flex: 1; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--bg); color: var(--text-secondary); }
.btn-danger { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger); }
.btn svg { width: 18px; height: 18px; }

.btn-add {
  width: 100%;
  padding: 12px;
  border: 1px dashed var(--primary);
  background: var(--primary-light);
  color: var(--primary);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 12px;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px;
}
.btn-add:hover { background: var(--primary); color: white; border-style: solid; }
.btn-add svg { width: 20px; height: 20px; }
/* 续存已合并进「新增存入」表单内的勾选，不再单独按钮 */

/* Deposit List */
.deposit-list { display: flex; flex-direction: column; gap: 10px; }
.deposit-card {
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  padding: 14px;
  box-shadow: var(--shadow);
  border-left: 3px solid var(--primary);
  transition: opacity 0.2s;
}
.deposit-card.withdrawn { opacity: 0.5; border-left-color: var(--text-tertiary); }
.deposit-card.overdue { border-left-color: var(--danger); }
.deposit-card.soon { border-left-color: var(--warning); }
.deposit-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.deposit-bank { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.deposit-bank svg { width: 18px; height: 18px; color: var(--primary); }
.badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.badge.active { background: var(--success-light); color: var(--success); }
.badge.withdrawn { background: #f0f0f0; color: var(--text-secondary); }
.badge.overdue { background: var(--danger-light); color: var(--danger); }
.badge.renew { background: var(--success-light); color: var(--success); }
.deposit-amount { font-size: 24px; font-weight: 700; color: var(--text-primary); }
.deposit-amount .currency { font-size: 14px; color: var(--text-secondary); font-weight: 400; }
.deposit-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 12px; margin-top: 8px; font-size: 13px; }
.deposit-detail-item { display: flex; flex-direction: column; }
.deposit-detail-label { color: var(--text-tertiary); font-size: 11px; }
.deposit-detail-value { color: var(--text-primary); font-weight: 500; }
/* 卡片右上角：提取(绿) + ⋯ 一组（替代原卡底按钮行） */
.top-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.deposit-action-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  background: white;
  color: var(--text-secondary);
  transition: all 0.2s;
  min-height: 44px;
  display: flex; align-items: center; gap: 4px;
}
.deposit-action-btn svg { width: 14px; height: 14px; }
.deposit-action-btn:hover { border-color: var(--primary); color: var(--primary); }
.deposit-action-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.deposit-action-btn.success { border-color: var(--success); color: var(--success); }
.deposit-action-btn.success:hover { background: var(--success); color: white; }
.deposit-action-btn.renew { border-color: var(--success); color: var(--success); background: var(--success-light); }
.deposit-action-btn.renew:hover { background: var(--success); color: white; }
/* 卡片右上角常驻「提取」按钮（绿/红/灰三态） */
.extract-btn { background: var(--success); color: #fff; border-color: var(--success); font-weight: 600; }
.extract-btn:hover { filter: brightness(0.93); }
.extract-btn.danger { background: var(--danger); border-color: var(--danger); }
.extract-btn.restored { background: var(--text-tertiary); border-color: var(--text-tertiary); }
.extract-btn.soon { box-shadow: 0 0 0 3px var(--warning-light); }
/* 更多操作「⋯」菜单 */
.action-menu { position: relative; }
.deposit-action-btn.action-more { padding: 6px 12px; min-width: 44px; justify-content: center; }
.deposit-action-btn.action-more svg { width: 18px; height: 18px; }
.action-menu-list { position: absolute; right: 0; top: calc(100% + 6px); min-width: 120px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 6px; z-index: 20; display: none; }
.action-menu-list.show { display: block; }
.action-menu-item { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 10px 12px; border-radius: 6px; font-size: 14px; color: var(--text-secondary); cursor: pointer; min-height: 44px; }
.action-menu-item:hover { background: var(--bg-secondary, #f5f7fa); color: var(--primary); }
.action-menu-item.extract { color: var(--success); font-weight: 600; }
.action-menu-item.extract:hover { background: var(--success-light, #f6ffed); color: var(--success); }
.action-menu-item.disabled { color: var(--text-tertiary); font-weight: 500; cursor: default; }
.action-menu-item.disabled:hover { background: transparent; color: var(--text-tertiary); }
.action-menu-item.danger { color: var(--danger); }
.action-menu-item.danger:hover { background: #fef2f2; color: var(--danger); }
/* 已提取卡片整卡变灰（含右上 ⋯），弱化由 .deposit-item.withdrawn 统一处理 */
.renew-hint { font-size: 12px; color: var(--primary); background: var(--primary-light); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; line-height: 1.5; }
.bank-renew-row { display: flex; align-items: center; gap: 10px; }
.bank-renew-row .form-select { flex: 1; min-width: 0; }
.renew-box {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 60px; height: 44px; padding: 0 14px; flex-shrink: 0;
  border: 2px solid var(--border, #d0d5dd); border-radius: 10px;
  background: #fff; color: var(--text-tertiary, #98a2b3);
  font-size: 14px; font-weight: 600; cursor: pointer; user-select: none;
  transition: all .15s ease;
}
.renew-box input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; }
.renew-box:hover { border-color: var(--success, #16a34a); }
.renew-box.active {
  border-color: var(--success, #16a34a);
  background: var(--success, #16a34a);
  color: #fff;
}
.deposit-note { font-size: 12px; color: var(--text-secondary); margin-top: 8px; padding: 6px 10px; background: var(--bg); border-radius: 6px; }

/* Bank Group */
.bank-group { margin-bottom: 14px; }
.bank-group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: linear-gradient(135deg, var(--primary-light) 0%, rgba(94,110,142,0.05) 100%);
  border-radius: var(--radius-sm);
  cursor: pointer;
  user-select: none;
  transition: all 0.15s;
}
.bank-group-header:active { background: var(--primary-light); opacity: 0.85; }
.bank-group-left { display: flex; align-items: center; gap: 8px; }
.bank-group-name { font-size: 16px; font-weight: 700; color: var(--primary); }
.bank-group-name svg { width: 18px; height: 18px; color: var(--primary); }
.overdue-flag {
  display: inline-block;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger);
  flex-shrink: 0;
  box-shadow: 0 0 0 2px #fff;
}
.bank-group-meta { display: flex; align-items: center; gap: 8px; }
.bank-group-count {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 14px;
  letter-spacing: 0.3px;
  box-shadow: 0 2px 6px rgba(76, 65, 194, 0.25);
  white-space: nowrap;
}
.bank-group-chevron { width: 18px; height: 18px; color: var(--text-tertiary); transition: transform 0.2s; }
.bank-group.collapsed .bank-group-chevron { transform: rotate(-90deg); }
.bank-group-items {
  display: grid;
  grid-template-rows: 1fr;
  margin-top: 8px;
  transition: grid-template-rows 0.2s ease;
}
.bank-group-items > .bank-group-inner {
  min-height: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
/* 折叠时再裁切（保留折叠动画）；展开时允许 ⋯ 下拉菜单溢出不被切掉 */
.bank-group.collapsed .bank-group-inner { overflow: hidden; }
.bank-group.collapsed .bank-group-items {
  grid-template-rows: 0fr;
}
.deposit-item {
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  box-shadow: var(--shadow);
  border-left: 3px solid var(--primary);
  transition: opacity 0.2s;
}
.deposit-item.withdrawn { opacity: 0.5; border-left-color: var(--text-tertiary); }
.deposit-item.overdue { border-left-color: var(--danger); }
.deposit-item.soon { border-left-color: var(--warning); }
.deposit-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.amount-group { display: flex; align-items: baseline; gap: 6px; }
.type-tag.renew { font-size: 13px; font-weight: 500; color: var(--success); }
.status-text { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
.status-text.danger { color: var(--danger); }
.status-text.muted { color: var(--text-tertiary); }
.deposit-item-amount { font-size: 20px; font-weight: 700; color: var(--text-primary); }
.deposit-item-amount .currency { font-size: 13px; color: var(--text-secondary); font-weight: 400; }
.deposit-item-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; font-size: 12px; }
.deposit-item-details .deposit-detail-label { color: var(--text-tertiary); font-size: 11px; }
.deposit-item-details .deposit-detail-value { color: var(--text-primary); font-weight: 500; }

/* Calendar */
.calendar-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.calendar-nav {
  display: flex; align-items: center; gap: 12px;
}
.calendar-nav-btn {
  width: 36px; height: 36px;
  border: none;
  background: var(--card-bg);
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow);
  transition: all 0.2s;
}
.calendar-nav-btn:hover { background: var(--primary-light); }
.calendar-nav-btn svg { width: 18px; height: 18px; color: var(--text-primary); }
.calendar-title { font-size: 17px; font-weight: 700; min-width: 120px; text-align: center; }
.calendar-month-summary {
  display: flex; gap: 12px; margin-bottom: 12px;
  font-size: 12px; color: var(--text-secondary);
}
.calendar-month-summary span { font-weight: 600; color: var(--primary); }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  padding: 8px;
  box-shadow: var(--shadow);
}
.calendar-weekday {
  text-align: center;
  font-size: 12px;
  color: var(--text-tertiary);
  padding: 6px 0;
  font-weight: 600;
}
.calendar-cell {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s;
  min-height: 44px;
}
.calendar-cell:hover { background: var(--bg); }
.calendar-cell.other-month { opacity: 0.3; }
.calendar-cell .day-num { font-size: 15px; font-weight: 500; }
.calendar-cell.today { background: var(--primary-light); }
.calendar-cell.today .day-num { color: var(--primary); font-weight: 700; }
.calendar-cell.has-deposit .day-num { font-weight: 700; }
.calendar-cell.has-deposit::after {
  content: '';
  position: absolute;
  bottom: 5px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--danger);
}
.calendar-cell.selected { background: var(--primary); }
.calendar-cell.selected .day-num { color: white; }
.calendar-cell.selected.has-deposit::after { background: white; }
.calendar-cell.selected:hover { background: var(--primary-dark); }

.calendar-detail { margin-top: 16px; }
.calendar-detail-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text-secondary); }
.calendar-detail-empty { text-align: center; color: var(--text-tertiary); padding: 16px 0; font-size: 14px; }

/* View Toggle */
.view-toggle {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-bottom: 12px;
}
.view-toggle-btn {
  padding: 5px 18px;
  border: 1px solid var(--border);
  border-radius: 16px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-secondary);
  background: white;
  transition: all 0.2s;
  min-height: 36px;
  font-family: inherit;
}
.view-toggle-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

/* Year View */
.calendar-grid.year-mode { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.year-cell {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  min-height: 76px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.year-cell:hover { border-color: var(--primary); }
.year-cell.has-deposit { border-color: var(--primary); background: var(--primary-light); }
.year-cell.current-month { box-shadow: inset 0 0 0 2px var(--primary); }
.year-cell .month-name { font-size: 15px; font-weight: 700; }
.year-cell .month-info { font-size: 11px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; display: flex; flex-direction: column; gap: 2px; }
.year-cell.has-deposit .month-info { color: var(--primary); }
.year-cell .month-info span { white-space: nowrap; }
.year-cell .month-info .mi-new { color: var(--primary); }
.year-cell .month-info .mi-renew { color: var(--success); }
.year-cell.selected { border-color: var(--primary); background: var(--primary); }
.year-cell.selected .month-name { color: white; }
.year-cell.selected .month-info { color: white; }
.year-cell.selected.has-deposit .month-info { color: white; }
.year-cell.selected .month-info span { color: white; }

/* Data Management */
.data-mgmt { margin-top: 24px; padding: 16px; }
.data-mgmt-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; }
.data-mgmt-actions { display: flex; gap: 8px; flex-wrap: nowrap; }
.data-mgmt-btn {
  flex: 1 1 0;
  min-width: 0;
  justify-content: center;
  white-space: nowrap;
  padding: 8px 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12.5px;
  cursor: pointer;
  background: white;
  color: var(--text-secondary);
  transition: all 0.2s;
  display: flex; align-items: center; gap: 4px;
  min-height: 40px;
}
.data-mgmt-btn:hover { border-color: var(--primary); color: var(--primary); }
.data-mgmt-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.data-mgmt-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
@media (max-width: 430px) {
  .data-mgmt-actions { gap: 6px; }
  .data-mgmt-btn { font-size: 11px; padding: 8px 2px; gap: 2px; }
  .data-mgmt-btn svg { width: 13px; height: 13px; }
}
/* 卡片右上角剩余时间徽章：用色区分（逾期红 / 临期橙 / 活期·已提取灰 / 正常黑） */
.status-text.warn { color: var(--warning); }

.backup-hint {
  font-size: 12px; color: var(--warning);
  background: var(--warning-light);
  padding: 8px 12px; border-radius: 8px;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;

  z-index: 1000;

  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {

}

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;

  background: rgba(0,0,0,0.8);
  color: white;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 2000;
  transition: transform 0.3s;

}

.empty-list { text-align: center; padding: 40px 20px; color: var(--text-tertiary); }
.empty-list svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }

.hidden { display: none !important; }

/* Mobile */
@media (max-width: 768px) {

<script>
// ========== Data Layer ==========
const STORAGE_KEY = 'wb_deposit_records';
const SAMPLE_KEY = 'wb_deposit_sample_loaded';
const EXPORT_KEY = 'wb_deposit_last_export';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    // 老数据缺 type 字段，默认视为新增存入，避免消失
    if (Array.isArray(arr)) {
      arr.forEach(function(d) { if (d && !d.type) d.type = 'new'; });
    }
    return arr;
  } catch(e) { return []; }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ========== Utilities ==========
function parseDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function todayStr() {
  return formatDate(new Date());
}

function addMonths(dateStr, months) {
  const date = parseDate(dateStr);
  date.setMonth(date.getMonth() + months);
  return formatDate(date);
}

function calcInterest(amount, rate, termMonths) {
  if (!termMonths || !rate) return 0;
  return amount * (rate / 100) * (termMonths / 12);
}

function calcMaturityDate(startDate, termMonths) {
  return addMonths(startDate, termMonths);
}

function formatMoney(num) {
  num = Math.round(num);
  if (num >= 1000000) {
    return Math.round(num / 10000) + ' 万';
  }
  return num.toLocaleString('zh-CN');
}

function formatMoneyFull(num) {
  return Math.round(num).toLocaleString('zh-CN');
}

function daysBetween(dateStr1, dateStr2) {
  const d1 = parseDate(dateStr1);
  const d2 = parseDate(dateStr2);
  return Math.round((d2 - d1) / 86400000);
}

// ========== Date Select Picker ==========
function initDateSelects() {
  var selY = document.getElementById('selYear');
  var selM = document.getElementById('selMonth');
  var selD = document.getElementById('selDay');
  var now = new Date();

  // Years: 2018 ~ current+1
  for (var y = 2018; y <= now.getFullYear() + 1; y++) {
    var opt = document.createElement('option');
    opt.value = y; opt.textContent = y + '年';
    selY.appendChild(opt);
  }
  // Months
  for (var m = 1; m <= 12; m++) {
    var optM = document.createElement('option');
    optM.value = m; optM.textContent = m + '月';
    selM.appendChild(optM);
  }

  selY.addEventListener('change', updateDayOptions);
  selM.addEventListener('change', updateDayOptions);

  setStartDateStr(todayStr());
}

function updateDayOptions() {
  var selY = document.getElementById('selYear');
  var selM = document.getElementById('selMonth');
  var selD = document.getElementById('selDay');
  var y = parseInt(selY.value);
  var m = parseInt(selM.value);
  var daysInMonth = new Date(y, m, 0).getDate();
  var prevDay = parseInt(selD.value) || 1;

  selD.innerHTML = '';
  for (var d = 1; d <= daysInMonth; d++) {
    var opt = document.createElement('option');
    opt.value = d; opt.textContent = d + '日';
    selD.appendChild(opt);
  }
  if (prevDay > daysInMonth) prevDay = daysInMonth;
  selD.value = prevDay;
}

function getStartDateStr() {
  var y = document.getElementById('selYear').value;
  var m = String(document.getElementById('selMonth').value).padStart(2, '0');
  var d = String(document.getElementById('selDay').value).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function setStartDateStr(dateStr) {
  if (!dateStr) { dateStr = todayStr(); }
  var parts = dateStr.split('-');
  var y = parseInt(parts[0]);
  var m = parseInt(parts[1]);
  var d = parseInt(parts[2]);

  var selY = document.getElementById('selYear');
  var selM = document.getElementById('selMonth');
  var selD = document.getElementById('selDay');

  // If year not in range, add it
  var yearExists = false;
  for (var i = 0; i < selY.options.length; i++) {
    if (parseInt(selY.options[i].value) === y) { yearExists = true; break; }
  }
  if (!yearExists) {
    var opt = document.createElement('option');
    opt.value = y; opt.textContent = y + '年';
    selY.appendChild(opt);
  }

  selY.value = y;
  selM.value = m;
  updateDayOptions();
  selD.value = d;
}

function generateId() {
  return Date.now() + Math.floor(Math.random() * 1000);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== Sample Data ==========
function loadSampleData() {
  if (localStorage.getItem(SAMPLE_KEY)) return;
  const today = new Date();
  const samples = [
    {
      id: generateId(),
      bank: '工商银行',
      amount: 50000,
      rate: 2.5,
      term: 12,
      startDate: '2025-08-01',
      maturityDate: '2026-08-01',
      note: '定期存款',
      status: 'active',
      createdAt: Date.now() - 5000000
    },
    {
      id: generateId(),
      bank: '建设银行',
      amount: 30000,
      rate: 2.0,
      term: 6,
      startDate: '2026-02-20',
      maturityDate: '2026-08-20',
      note: '',
      status: 'active',
      createdAt: Date.now() - 4000000
    },
    {
      id: generateId(),
      bank: '招商银行',
      amount: 100000,
      rate: 3.0,
      term: 12,
      startDate: '2026-06-15',
      maturityDate: '2027-06-15',
      note: '大额存单',
      status: 'active',
      createdAt: Date.now() - 3000000
    },
    {
      id: generateId(),
      bank: '农业银行',
      amount: 20000,
      rate: 1.8,
      term: 3,
      startDate: '2026-07-01',
      maturityDate: '2026-10-01',
      note: '',
      status: 'active',
      createdAt: Date.now() - 2000000
    },
    {
      id: generateId(),
      bank: '中国银行',
      amount: 80000,
      rate: 3.5,
      term: 24,
      startDate: '2026-08-10',
      maturityDate: '2028-08-10',
      note: '三年期大额存单',
      status: 'active',
      createdAt: Date.now() - 1000000
    },
    {
      id: generateId(),
      bank: '工商银行',
      amount: 15000,
      rate: 0.25,
      term: null,
      startDate: '2026-08-16',
      maturityDate: '',
      note: '活期备用金',
      status: 'active',
      createdAt: Date.now() - 500000
    },
    {
      id: generateId(),
      bank: '工商银行',
      amount: 60000,
      type: 'renew',
      rate: 2.75,
      term: 12,
      startDate: '2024-06-15',
      renewCount: 2,
      maturityDate: '2027-06-15',
      note: '2024-06 存入，已续存 2 期',
      status: 'active',
      createdAt: Date.now() - 6000000
    }
  ];
  samples.forEach(function(s) { s.sample = true; });
  saveData(samples);
  localStorage.setItem(SAMPLE_KEY, '1');
}

// ========== Summary ==========
function renderSummary() {
  var data = loadData();
  var active = data.filter(function(d) { return d.status === 'active'; });
  var totalAmount = active.reduce(function(s, d) { return s + d.amount; }, 0);
  var totalInterest = active.reduce(function(s, d) { return s + calcInterest(d.amount, d.rate, d.term); }, 0);

  document.getElementById('totalAmount').textContent = formatMoney(totalAmount);
  document.getElementById('totalInterest').textContent = formatMoney(totalInterest);

  // Backup hint: remind when no export for 7+ days, or 30+ records, or never exported
  var hint = document.getElementById('backupHint');
  var hintText = document.getElementById('backupHintText');
  var realData = data.filter(function(d) { return !d.sample; });
  var shouldRemind = false;
  var msg = '';
  if (realData.length > 0) {
    var lastExport = parseInt(localStorage.getItem(EXPORT_KEY) || '0');
    var daysSinceExport = lastExport ? Math.floor((Date.now() - lastExport) / 86400000) : -1;
    if (daysSinceExport < 0) {
      shouldRemind = true;
      msg = '还没有备份过，建议点右上角「导出备份」存一份';
    } else if (daysSinceExport >= 7) {
      shouldRemind = true;
      msg = '距上次备份已 ' + daysSinceExport + ' 天，建议导出最新备份';
    } else if (realData.length >= 30) {
      shouldRemind = true;
      msg = '数据已积累 ' + realData.length + ' 条，建议导出备份';
    }
  }
  if (shouldRemind) {
    hint.classList.remove('hidden');
    hintText.textContent = msg;
  } else {
    hint.classList.add('hidden');
  }
}

// ========== Deposit List ==========
// 剩余期限/状态徽章（支持活期）
function depositRemainBadge(d) {
  var today = todayStr();
  if (d.status === 'withdrawn') return '<span class="status-text muted">已提取</span>';
  if (!d.maturityDate) return '<span class="status-text muted">活期</span>';
  var remDays = daysBetween(today, d.maturityDate);
  if (remDays < 0) return '<span class="status-text danger">已逾期' + Math.abs(remDays) + '天</span>';
  if (remDays === 0) return '<span class="status-text warn">今天到期</span>';
  if (remDays < 30) return '<span class="status-text warn">剩' + remDays + '天</span>';
  return '<span class="status-text">剩' + Math.floor(remDays / 30) + '个月</span>';
}

// 续存标签已合并到金额前（.type-tag.renew），不再单独成徽章

// 明细行（支持活期：利率/期限/利息/到期总额显示 —）
function depositDetailHtml(d) {
  var interest = calcInterest(d.amount, d.rate, d.term);
  var rateText = d.rate ? d.rate.toFixed(2) + '%' : '—';
  var termText = d.term ? d.term + '月' : '活期';
  var maturityText = d.maturityDate ? d.maturityDate : '-';
  var interestText = d.term ? '¥' + formatMoneyFull(interest) : '—';
  return '<div class="deposit-item-details">' +
    '<div class="deposit-detail-item"><span class="deposit-detail-label">' + (d.type === 'renew' ? '续存日期' : '存入日期') + '</span><span class="deposit-detail-value">' + (d.startDate || '—') + '</span></div>' +
    '<div class="deposit-detail-item"><span class="deposit-detail-label">到期日期</span><span class="deposit-detail-value">' + maturityText + '</span></div>' +
    '<div class="deposit-detail-item"><span class="deposit-detail-label">剩余时间</span><span class="deposit-detail-value">' + depositRemainBadge(d) + '</span></div>' +
    '<div class="deposit-detail-item"><span class="deposit-detail-label">利率/期限</span><span class="deposit-detail-value">' + rateText + ' / ' + termText + '</span></div>' +
    '<div class="deposit-detail-item"><span class="deposit-detail-label">预估利息</span><span class="deposit-detail-value">' + interestText + '</span></div>' +
  '</div>';
}

function renderList() {
  var data = loadData();
  var container = document.getElementById('depositList');
  var today = todayStr();

  if (data.length === 0) {
    container.innerHTML = '<div class="empty-list">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l2-4h14l2 4"/></svg>' +
      '<div>还没有存款记录，点击上方添加</div></div>';
    return;
  }

  data.sort(function(a, b) {
    // 排序桶：0=活期(无到期)最前，1=未提取定期(按到期日近→远)，2=已提取垫底
    var wa = (a.status === 'withdrawn') ? 2 : (!a.maturityDate ? 0 : 1);
    var wb = (b.status === 'withdrawn') ? 2 : (!b.maturityDate ? 0 : 1);
    if (wa !== wb) return wa - wb;
    var am = a.maturityDate || '';
    var bm = b.maturityDate || '';
    if (am !== bm) return am < bm ? -1 : 1;
    return (a.id < b.id) ? -1 : 1; // 兜底稳定排序
  });

  // Group by bank
  var groups = {};
  var bankOrder = [];
  data.forEach(function(d) {
    var bankKey = d.bank || '未填写银行';
    if (!groups[bankKey]) { groups[bankKey] = []; bankOrder.push(bankKey); }
    groups[bankKey].push(d);
  });

  var bankIconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M3 10h18"/><path d="M5 6l7-3 7 3"/><path d="M4 10v11"/><path d="M20 10v11"/><path d="M8 14v4"/><path d="M12 14v4"/><path d="M16 14v4"/></svg>';
  var chevronSvg = '<svg class="bank-group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';

  var html = '';
  bankOrder.forEach(function(bankKey) {
    var deposits = groups[bankKey];
    var bankTotal = deposits.reduce(function(s, d) { return s + d.amount; }, 0);
    var hasOverdue = deposits.some(function(d) { return d.status === 'active' && d.maturityDate && d.maturityDate < today; });
    var overdueCount = deposits.filter(function(d) { return d.status === 'active' && d.maturityDate && d.maturityDate < today; }).length;

    html += '<div class="bank-group' + (hasOverdue ? '' : ' collapsed') + '">';
    html += '<div class="bank-group-header" onclick="this.parentElement.classList.toggle(\'collapsed\')">';
    html += '<div class="bank-group-left">';
    html += '<span class="bank-group-name">' + bankIconSvg + escapeHtml(bankKey) + '</span>';
    html += '</div>';
    html += '<div class="bank-group-meta">';
    if (overdueCount > 0) html += '<span class="overdue-flag" title="' + overdueCount + ' 笔已逾期"></span>';
    html += '<span class="bank-group-count">¥' + formatMoney(bankTotal) + '</span>';
    html += chevronSvg;
    html += '</div>';
    html += '</div>';
    html += '<div class="bank-group-items"><div class="bank-group-inner">';

    deposits.forEach(function(d) {
      var isOverdue = d.status === 'active' && d.maturityDate && d.maturityDate < today;
      var isSoon = d.status === 'active' && d.maturityDate && d.maturityDate >= today && d.maturityDate <= formatDate(new Date(Date.now() + 7 * 86400000));
      var itemClass = 'deposit-item';
      if (d.status === 'withdrawn') itemClass += ' withdrawn';
      else if (isOverdue) itemClass += ' overdue';
      else if (isSoon) itemClass += ' soon';

      html += '<div class="' + itemClass + '">';
      html += '<div class="deposit-item-top">';
      html += '<div class="amount-group">';
      html += '<div class="deposit-item-amount"><span class="currency">¥</span>' + formatMoneyFull(d.amount) + '</div>';
      if (d.type === 'renew') html += '<span class="type-tag renew">续存</span>';
      html += '</div>';
      html += '<div class="top-right">';
      var dotsSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
      var wdIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>';
      var wdClass = 'deposit-action-btn extract-btn';
      var wdTxt;
      if (d.status === 'withdrawn') { wdClass += ' restored'; wdTxt = '已提取 / 恢复'; }
      else { wdTxt = '提取'; if (isOverdue) wdClass += ' danger'; else if (isSoon) wdClass += ' soon'; }
      html += '<button class="' + wdClass + '" onclick="toggleWithdraw(' + d.id + ')">' + wdIcon + wdTxt + '</button>';
      html += '<div class="action-menu">';
      html += '<button class="deposit-action-btn action-more" aria-label="更多操作" onclick="toggleActionMenu(event, ' + d.id + ')">' + dotsSvg + '</button>';
      html += '<div class="action-menu-list" id="menu-' + d.id + '">' +
        '<button class="action-menu-item" onclick="openEditForm(' + d.id + ')">编辑</button>' +
        '<button class="action-menu-item danger" onclick="confirmDelete(' + d.id + ')">删除</button>' +
        '</div>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
      html += depositDetailHtml(d);

      if (d.note) {
        html += '<div class="deposit-note">' + escapeHtml(d.note) + '</div>';
      }

      html += '</div>';
    });

    html += '</div></div></div>';
  });

  container.innerHTML = html;
}

// ========== Add Form ==========
function resetAddForm() {
  document.getElementById('editId').value = '';
  document.getElementById('inputRenew').checked = false;
  document.getElementById('renewBox').classList.remove('active');
  document.getElementById('startDateLabel').textContent = '存入日期';
  document.getElementById('selYear').disabled = false;
  document.getElementById('selMonth').disabled = false;
  document.getElementById('selDay').disabled = false;
  document.getElementById('inputBank').value = '';
  document.getElementById('inputAmount').value = '';
  document.getElementById('inputRate').value = '';
  document.getElementById('inputTerm').value = '';
  document.getElementById('inputNote').value = '';
  setStartDateStr(todayStr());
  document.querySelectorAll('.term-chip').forEach(function(c) { c.classList.remove('active'); });
  document.getElementById('formTitle').textContent = '新增存款记录';
  document.getElementById('formSubmitText').textContent = '确认添加';
}

function closeAddForm() {
  var form = document.getElementById('addForm');
  form.classList.remove('show');
  document.getElementById('addBtn').style.display = 'flex';
  resetAddForm();
}

// 打开新增表单：是否续存由表单内「是否续存」勾选决定
function openAddForm() {
  resetAddForm();
  var form = document.getElementById('addForm');
  form.classList.add('show');
  document.getElementById('addBtn').style.display = 'none';
  document.getElementById('inputBank').focus();
}

function openEditForm(id) {
  var data = loadData();
  var d = data.find(function(item) { return item.id === id; });
  if (!d) return;

  document.getElementById('editId').value = d.id;
  // 银行下拉：若老数据银行不在选项中，动态补一个选项避免丢数据
  var bankSel = document.getElementById('inputBank');
  var bankVal = d.bank || '';
  var bankExists = false;
  for (var bi = 0; bi < bankSel.options.length; bi++) {
    if (bankSel.options[bi].value === bankVal) { bankExists = true; break; }
  }
  if (!bankExists && bankVal) {
    var bankOpt = document.createElement('option');
    bankOpt.value = bankVal; bankOpt.textContent = bankVal;
    bankSel.appendChild(bankOpt);
  }
  bankSel.value = bankVal;
  document.getElementById('inputAmount').value = d.amount;
  document.getElementById('inputRate').value = d.rate == null ? '' : d.rate;
  document.getElementById('inputTerm').value = d.term == null ? '' : d.term;
  setStartDateStr(d.startDate);
  document.getElementById('inputNote').value = d.note || '';
  var isRenew = d.type === 'renew';
  document.getElementById('inputRenew').checked = isRenew;
  document.getElementById('renewBox').classList.toggle('active', isRenew);
  document.getElementById('startDateLabel').textContent = isRenew ? '续存日期' : '存入日期';

  document.getElementById('formTitle').textContent = '编辑存款记录';
  document.getElementById('formSubmitText').textContent = '保存修改';

  // 编辑模式：不新增记录，日期可自由改
  document.getElementById('selYear').disabled = false;
  document.getElementById('selMonth').disabled = false;
  document.getElementById('selDay').disabled = false;

  // Sync term chip active state
  document.querySelectorAll('.term-chip').forEach(function(c) {
    c.classList.remove('active');
    if (d.term) {
      var termText = c.textContent.replace(/[^\d]/g, '');
      if (parseInt(termText) === d.term) c.classList.add('active');
    } else {
      if (c.textContent.indexOf('活期') >= 0) c.classList.add('active');
    }
  });

  var form = document.getElementById('addForm');
  document.getElementById('addBtn').style.display = 'none';
  form.classList.add('show');

  // Scroll to form
  form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('inputBank').focus();
}

// 续存由新增表单内「是否续存」勾选决定

function setTerm(months) {
  document.getElementById('inputTerm').value = months;
  document.querySelectorAll('.term-chip').forEach(function(c) { c.classList.remove('active'); });
  event.target.classList.add('active');
}

// 勾选「是否续存」时切换表单文案与日期标签
function toggleRenewMode(checked) {
  document.getElementById('startDateLabel').textContent = checked ? '续存日期' : '存入日期';
  document.getElementById('formTitle').textContent = checked ? '新增续存存款' : '新增存款记录';
  document.getElementById('formSubmitText').textContent = checked ? '确认续存' : '确认添加';
  document.getElementById('renewBox').classList.toggle('active', checked);
}

function submitDeposit() {
  var editId = document.getElementById('editId').value;
  var bank = document.getElementById('inputBank').value.trim();
  var amountRaw = document.getElementById('inputAmount').value.trim();
  var amount = parseFloat(amountRaw);
  var rateRaw = document.getElementById('inputRate').value.trim();
  var rate = rateRaw === '' ? null : parseFloat(rateRaw);
  var termRaw = document.getElementById('inputTerm').value.trim();
  var term = termRaw === '' ? null : parseInt(termRaw);
  var startDate = getStartDateStr();
  var note = document.getElementById('inputNote').value.trim();

  if (!bank) { showToast('请选择银行'); return; }
  if (!amount || amount <= 0 || Math.floor(amount) !== amount) { showToast('请输入整数金额（元）'); return; }
  if (rate !== null && (isNaN(rate) || rate < 0)) { showToast('请输入有效的年利率'); return; }
  if (term !== null && (isNaN(term) || term <= 0)) { showToast('请输入有效的存款期限'); return; }
  if (!startDate) { showToast('请选择存入日期'); return; }

  var maturityDate = term ? calcMaturityDate(startDate, term) : '';
  var data = loadData();

  if (editId) {
    // Edit existing
    var item = data.find(function(d) { return d.id == editId; });
    if (!item) { showToast('记录不存在'); return; }

    item.bank = bank || '未填写银行';
    item.amount = amount;
    item.rate = rate;
    var dateChanged = startDate !== item.startDate;
    var termChanged = term !== item.term;
    item.term = term;
    item.startDate = startDate;
    if (dateChanged || termChanged) {
      item.maturityDate = term ? calcMaturityDate(startDate, term) : '';
    }
    item.note = note;
    item.updatedAt = Date.now();
    saveData(data);
    closeAddForm();
    renderAll();
    showToast('存款记录已保存');
  } else {
    // Add new：按入口区分 新增存入 / 续存
    var deposit = {
      id: generateId(),
      type: document.getElementById('inputRenew').checked ? 'renew' : 'new',
      bank: bank || '未填写银行',
      amount: amount,
      rate: rate,
      term: term,
      startDate: startDate,
      maturityDate: maturityDate,
      note: note,
      status: 'active',
      createdAt: Date.now()
    };
    data.push(deposit);
    saveData(data);
    closeAddForm();
    renderAll();
    showToast(document.getElementById('inputRenew').checked ? '续存记录已添加' : '存款记录已添加');
  }
}

// ========== Actions ==========
function toggleWithdraw(id) {
  var data = loadData();
  var item = data.find(function(d) { return d.id == id; });
  if (!item) return;
  if (item.status === 'withdrawn') {
    item.status = 'active';
    item.withdrawnAt = null;
  } else {
    item.status = 'withdrawn';
    item.withdrawnAt = Date.now();
  }
  saveData(data);
  renderAll();
}

// 操作「⋯」菜单：点开/收起，点菜单外部自动关闭
function toggleActionMenu(e, id) {
  e.stopPropagation();
  var list = document.getElementById('menu-' + id);
  if (!list) return;
  var wasOpen = list.classList.contains('show');
  closeAllMenus();
  if (!wasOpen) list.classList.add('show');
}
function closeAllMenus() {
  var open = document.querySelectorAll('.action-menu-list.show');
  for (var i = 0; i < open.length; i++) open[i].classList.remove('show');
}
if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
  document.addEventListener('click', function(e) {
    if (!e.target.closest || !e.target.closest('.action-menu')) closeAllMenus();
  });
}

function confirmDelete(id) {
  showConfirm('删除记录', '确定要删除这笔存款记录吗？此操作不可撤销。', function() {
    var data = loadData();
    data = data.filter(function(d) { return d.id !== id; });
    saveData(data);
    renderAll();
    showToast('记录已删除');
  });
}

function confirmClearAll() {
  showConfirm('清空所有数据', '确定要清空所有存款记录吗？此操作不可撤销，建议先导出备份！', function() {
    saveData([]);
    renderAll();
    showToast('所有数据已清空');
  });
}

function showConfirm(title, text, callback) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmModal').classList.add('show');
  var btn = document.getElementById('confirmOkBtn');
  btn.onclick = function() {
    closeConfirm();
    callback();
  };
}

function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('show');
}

// ========== Tab Switch ==========
function switchTab(tab) {
  if (tab === 'list') {
    document.getElementById('listTab').classList.remove('hidden');
    document.getElementById('calendarTab').classList.add('hidden');
    document.getElementById('tabList').classList.add('active');
    document.getElementById('tabCalendar').classList.remove('active');
  } else {
    document.getElementById('listTab').classList.add('hidden');
    document.getElementById('calendarTab').classList.remove('hidden');
    document.getElementById('tabList').classList.remove('active');
    document.getElementById('tabCalendar').classList.add('active');

}

// ========== Calendar ==========
var calYear, selectedMonth = null, calendarMode = 'maturity';

function initCalendar() {
  calYear = new Date().getFullYear();
  selectedMonth = null;
}

function setCalMode(mode) {
  calendarMode = mode;
  selectedMonth = null;
  document.getElementById('btnMaturityView').classList.toggle('active', mode === 'maturity');
  document.getElementById('btnDepositView').classList.toggle('active', mode === 'deposit');
  renderCalendar();
}

function calPrev() {
  calYear--;
  selectedMonth = null;
  renderCalendar();
}

function calNext() {
  calYear++;
  selectedMonth = null;
  renderCalendar();
}

function selectMonth(m) {
  selectedMonth = (selectedMonth === m) ? null : m;
  renderCalendar();
}

// 取某年某月、指定日期字段（startDate=存入 / maturityDate=到期）的记录
function getMonthDeposits(deposits, year, month, dateField) {
  var mStart = year + '-' + String(month + 1).padStart(2, '0') + '-01';
  var mEnd = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(new Date(year, month + 1, 0).getDate());
  return deposits.filter(function(d) {
    return d[dateField] && d[dateField] >= mStart && d[dateField] <= mEnd;
  });
}

function renderCalendar() {
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var titleEl = document.getElementById('calendarTitle');
  var gridEl = document.getElementById('calendarGrid');
  var today = new Date();
  var dateField = calendarMode === 'deposit' ? 'startDate' : 'maturityDate';
  var actionLabel = calendarMode === 'deposit' ? '存入' : '到期';

  titleEl.textContent = calYear + '年';

  var all = loadData();
  if (calendarMode === 'maturity') {
    all = all.filter(function(d) { return d.status === 'active'; });
  }

  var yearStart = calYear + '-01-01';
  var yearEnd = calYear + '-12-31';
  var yearDeposits = all.filter(function(d) {
    return d[dateField] && d[dateField] >= yearStart && d[dateField] <= yearEnd;
  }).sort(function(a, b) { return a[dateField] < b[dateField] ? -1 : 1; });

  // 12 宫格
  var html = '';
  for (var m = 0; m < 12; m++) {
    var mList = getMonthDeposits(all, calYear, m, dateField);
    var cls = 'year-cell';
    if (mList.length > 0) cls += ' has-deposit';
    if (today.getFullYear() === calYear && today.getMonth() === m) cls += ' current-month';
    if (selectedMonth === m) cls += ' selected';
    var info;
    if (mList.length === 0) {
      info = '无' + actionLabel;
    } else if (calendarMode === 'deposit') {
      // 存入视图：首存 / 续存 分开显示，哪类为 0 就不显示哪行
      var newAmt = 0, newCnt = 0, renewAmt = 0, renewCnt = 0;
      mList.forEach(function(d) {
        if (d.type === 'renew') { renewAmt += d.amount; renewCnt++; }
        else { newAmt += d.amount; newCnt++; }
      });
      info = '';
      if (newCnt > 0) info += '<span class="mi-new">首存 ¥' + formatMoney(newAmt) + '</span>';
      if (renewCnt > 0) info += '<span class="mi-renew">续存 ¥' + formatMoney(renewAmt) + '</span>';
    } else {
      var mAmount = mList.reduce(function(s, d) { return s + d.amount; }, 0);
      info = '¥' + formatMoney(mAmount);
    }
    html += '<div class="' + cls + '" onclick="selectMonth(' + m + ')">' +
      '<div class="month-name">' + monthNames[m] + '</div>' +
      '<div class="month-info">' + info + '</div>' +
    '</div>';
  }
  gridEl.innerHTML = html;

  // 全年汇总
  var summaryHtml;
  if (calendarMode === 'deposit') {
    var yearNew = yearDeposits.filter(function(d) { return d.type !== 'renew'; });
    var yearRenew = yearDeposits.filter(function(d) { return d.type === 'renew'; });
    var newAmt = yearNew.reduce(function(s, d) { return s + d.amount; }, 0);
    var renewAmt = yearRenew.reduce(function(s, d) { return s + d.amount; }, 0);
    summaryHtml = '本年首存 <span>¥' + formatMoney(newAmt) + '</span>（' + yearNew.length + '笔）　续存 <span>¥' + formatMoney(renewAmt) + '</span>（' + yearRenew.length + '笔）';
  } else {
    var yearAmount = yearDeposits.reduce(function(s, d) { return s + d.amount; }, 0);
    summaryHtml = yearDeposits.length > 0
      ? '本年' + actionLabel + '，本金 <span>¥' + formatMoney(yearAmount) + '</span>'
      : '本年无' + actionLabel + '记录';
  }
  document.getElementById('calendarMonthSummary').innerHTML = summaryHtml;

  // 详情：选中月份看该月，未选中看全年
  var detailDeposits = selectedMonth !== null
    ? getMonthDeposits(all, calYear, selectedMonth, dateField)
    : yearDeposits;
  renderCalendarDetail(detailDeposits, selectedMonth);
}

function renderCalendarDetail(deposits, month) {
  var title = document.getElementById('calendarDetailTitle');
  var content = document.getElementById('calendarDetailContent');
  var actionLabel = calendarMode === 'deposit' ? '存入' : '到期';
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  if (month !== null) {
    title.textContent = calYear + '年' + monthNames[month] + actionLabel + '存款';
  } else {
    title.textContent = calYear + '年' + actionLabel + '存款';
  }
  if (deposits.length === 0) {
    content.innerHTML = '<div class="calendar-detail-empty">' + (month !== null ? '这个月没有存款记录' : '今年没有存款记录') + '</div>';
    return;
  }
  // 统一按银行分组展示；首存 / 续存 由卡片上的「续存」徽章区分，不再单独分层
  content.innerHTML = renderDepositCards(deposits);
}

function renderDepositCards(deposits) {
  var today = todayStr();

  // Group by bank
  var groups = {};
  var bankOrder = [];
  deposits.forEach(function(d) {
    var bankKey = d.bank || '未填写银行';
    if (!groups[bankKey]) { groups[bankKey] = []; bankOrder.push(bankKey); }
    groups[bankKey].push(d);
  });

  var bankIconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M3 10h18"/><path d="M5 6l7-3 7 3"/><path d="M4 10v11"/><path d="M20 10v11"/><path d="M8 14v4"/><path d="M12 14v4"/><path d="M16 14v4"/></svg>';
  var chevronSvg = '<svg class="bank-group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';

  var html = '';
  bankOrder.forEach(function(bankKey) {
    var items = groups[bankKey];
    var bankTotal = items.reduce(function(s, d) { return s + d.amount; }, 0);
    var overdueCount = items.filter(function(d) { return d.status === 'active' && d.maturityDate && d.maturityDate < today; }).length;

    html += '<div class="bank-group">';
    html += '<div class="bank-group-header" onclick="this.parentElement.classList.toggle(\'collapsed\')">';
    html += '<div class="bank-group-left"><span class="bank-group-name">' + bankIconSvg + escapeHtml(bankKey) + '</span></div>';
    html += '<div class="bank-group-meta">' + (overdueCount > 0 ? '<span class="overdue-flag" title="' + overdueCount + ' 笔已逾期"></span>' : '') + '<span class="bank-group-count">¥' + formatMoney(bankTotal) + '</span>' + chevronSvg + '</div>';
    html += '</div>';
    html += '<div class="bank-group-items"><div class="bank-group-inner">';

    items.forEach(function(d) {
      var isOverdue = d.status === 'active' && d.maturityDate && d.maturityDate < today;

      var itemClass = 'deposit-item';
      if (d.status === 'withdrawn') itemClass += ' withdrawn';
      else if (isOverdue) itemClass += ' overdue';
      else itemClass += ' soon';

      html += '<div class="' + itemClass + '">';
      html += '<div class="deposit-item-top">';
      html += '<div class="amount-group">';
      html += '<div class="deposit-item-amount"><span class="currency">¥</span>' + formatMoneyFull(d.amount) + '</div>';
      if (d.type === 'renew') html += '<span class="type-tag renew">续存</span>';
      html += '</div>';
      html += '</div>';
      html += depositDetailHtml(d);
      html += '</div>';
    });

    html += '</div></div></div>';
  });

  return html;
}

// ========== Export / Import ==========
function exportData() {
  var data = loadData().filter(function(d) { return !d.sample; });
  if (data.length === 0) { showToast('没有数据可导出'); return; }
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '小金库备份_' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  localStorage.setItem(EXPORT_KEY, String(Date.now()));
  showToast('已导出 ' + data.length + ' 条记录');
}

function exportCSV() {
  var data = loadData().filter(function(d) { return !d.sample; });
  if (data.length === 0) { showToast('没有数据可导出'); return; }
  var csv = '\uFEFF银行,类型,金额(元),年利率(%),期限,存入日期,到期日期,预估利息(元),到期总额(元),状态,备注\n';
  data.forEach(function(d) {
    var interest = calcInterest(d.amount, d.rate, d.term);
    var rateTxt = d.rate == null ? '' : d.rate;
    var termTxt = d.term == null ? '活期' : d.term;
    var maturityTxt = d.maturityDate || '活期';
    var interestTxt = d.term ? Math.round(interest) : '';
    var maturityAmountTxt = d.term ? Math.round(d.amount + interest) : '';
    var typeTxt = d.type === 'renew' ? '续存' : '首存';
    csv += (d.bank || '') + ',' + typeTxt + ',' + d.amount + ',' + rateTxt + ',' + termTxt + ',' + d.startDate + ',' + maturityTxt + ',' + interestTxt + ',' + maturityAmountTxt + ',' + (d.status === 'active' ? '存入中' : '已提取') + ',' + (d.note || '') + '\n';
  });
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '小金库_' + todayStr() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV已导出');
}

function importData(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) { showToast('文件格式错误'); return; }
      imported = imported.filter(function(d) { return !d.sample; });
      showConfirm('导入恢复', '导入将替换当前所有数据，共导入 ' + imported.length + ' 条记录。确定继续吗？', function() {
        saveData(imported);
        renderAll();
        showToast('导入成功，共 ' + imported.length + ' 条记录');
      });
    } catch(err) {
      showToast('导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ========== Render All ==========
function renderAll() {
  renderSummary();
  renderList();
  if (!document.getElementById('calendarTab').classList.contains('hidden')) {
    renderCalendar();
  }
}

// ========== Init ==========
function init() {
  loadSampleData();
  initCalendar();
  initDateSelects();
  renderAll();
}

init();
</script>
